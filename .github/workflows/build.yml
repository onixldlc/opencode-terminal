name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. v1.1.1 or v1.1.0-r2). Empty = read the VERSION file.'
        required: false
        default: ''
      publish:
        description: 'Push to GHCR. Uncheck to build and smoke test only.'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opencode-terminal

permissions:
  contents: read
  packages: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      opencode: ${{ steps.version.outputs.opencode }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          INPUT_VERSION='${{ github.event.inputs.version }}'

          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          if [[ -z "${VERSION}" ]]; then
            echo "::error::VERSION is empty."
            exit 1
          fi

          # The file carries the v itself (v1.1.0), optionally with a rebuild
          # revision (v1.1.0-r2). A bare input still gets the prefix.
          [[ "${VERSION}" == v* ]] || VERSION="v${VERSION}"

          # Docker tags allow a narrow character set; sanitise rather than fail.
          VERSION="$(printf '%s' "${VERSION}" | tr -c 'A-Za-z0-9._-' '-')"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            PUBLISH='${{ github.event.inputs.publish }}'
          else
            # The only other trigger is a push that changed VERSION.
            PUBLISH=true
          fi

          # The pinned opencode release lives in the Dockerfile; surface it so the
          # smoke test and the release notes cannot drift from what was built.
          OPENCODE="$(sed -n 's/^ARG OPENCODE_VERSION=\(.*\)$/\1/p' docker/Dockerfile | head -1)"

          if [[ -z "${OPENCODE}" ]]; then
            echo "::error::could not read ARG OPENCODE_VERSION from docker/Dockerfile"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "opencode=${OPENCODE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} publish=${PUBLISH} opencode=${OPENCODE}"

  build-and-push:
    name: Build image
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke test
        # docker/verify.sh ships in the image: toolchain, seeding, GLM provider
        # resolution and the env overrides, in one container, one pass.
        run: |
          set -euo pipefail
          docker run --rm \
            -e EXPECTED_OPENCODE_VERSION="${EXPECTED_OPENCODE_VERSION}" \
            --entrypoint /usr/local/bin/opencode-verify.sh \
            "${IMAGE_NAME}:ci"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          EXPECTED_OPENCODE_VERSION: ${{ needs.determine-version.outputs.opencode }}

      - name: Log in to GitHub Container Registry
        if: needs.determine-version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: needs.determine-version.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.determine-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.determine-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Summary
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          IMG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          echo "**Version:** \`${V}\`" >> $GITHUB_STEP_SUMMARY
          echo "**opencode:** \`${{ needs.determine-version.outputs.opencode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Published:** ${{ needs.determine-version.outputs.publish }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMG}:${V}\`, \`${IMG}:latest\` (linux/amd64, linux/arm64)" >> $GITHUB_STEP_SUMMARY

  release:
    name: Tag and release
    runs-on: ubuntu-latest
    needs: [determine-version, build-and-push]
    if: needs.determine-version.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Creates the tag at this commit if it does not exist yet, and attaches
      # GitHub's own source zip/tar.gz. Nothing is built here.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.version }}
          name: ${{ needs.determine-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Ships opencode `${{ needs.determine-version.outputs.opencode }}`.

            ```
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.determine-version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ```

      - name: Summary
        run: |
          V="${{ needs.determine-version.outputs.version }}"
          echo "**Tag:** \`${V}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:** source zip and tar.gz, generated by GitHub" >> $GITHUB_STEP_SUMMARY
